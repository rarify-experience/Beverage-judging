<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Judge · Rarify</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="/shared/styles.css"><style>.flight-choice{width:100%;border:1px solid #ffffff77;border-radius:10px;padding:16px;margin:8px 0;background:white;color:#222;text-align:left;cursor:pointer}.flight-choice small{display:block;margin-top:6px;color:#666}.flight-choice strong{font-size:16px}.waiting-status{margin:22px 0!important}.orange-screen .connection{color:#fff}.screen-header button{border:0;background:none;color:#bd4c28;font:inherit;cursor:pointer}.flight-list-header{position:relative;padding-top:66px}.flight-list-header #back-waiting{position:absolute;top:12px;left:14px;min-height:44px;padding:8px 10px;text-align:left;font-size:15px}.wine-tile{width:100%}.judge-saved{font-size:11px;color:#777;padding:12px 24px}.criterion-body[hidden]{display:none}.submitted-note{padding:20px;background:#f2f8f2;margin:20px;border-radius:10px;line-height:1.6}.screen{padding-bottom:100px}.waiting-flights{width:100%}.orange-screen{padding-bottom:35px}.account-bar{position:sticky;top:0}.app-shell{min-height:calc(100vh - 40px)}@media(max-width:600px){.app-shell{padding:0}.phone{height:calc(100dvh - 40px);min-height:0;border:0;border-radius:0;width:100%;box-shadow:none}}</style></head><body><main class="app-shell"><section class="phone" aria-live="polite"><div class="screen active" id="waiting-screen"><div class="orange-screen"><div class="event-lockup">Cincinnati<br>International Wine Festival</div><h1>Wine judging</h1><div class="judge-card"><strong id="judge-name">Loading…</strong><span id="panel-name"></span></div><div class="waiting-status" id="waiting-status">Checking released flights…</div><div id="waiting-flights" class="waiting-flights"></div><p id="connection-status" class="connection"></p></div></div><div class="screen" id="flight-screen"><header class="screen-header flight-list-header"><button id="back-waiting" type="button" aria-label="Back to your flights">‹ Back</button><div><div class="eyebrow">Your flight</div><h2 id="flight-title"></h2><p class="subtle" id="flight-description"></p></div></header><div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div><div class="progress-copy" id="progress-copy"></div></div><p class="judge-saved">Submit each wine when complete. Drafts stay private.</p><div class="wine-list" id="wine-list"></div></div><div class="screen" id="wine-screen"><div class="judging-brand"><span>rarify</span><span>JUDGING</span></div><header class="wine-header"><div id="wine-context" class="wine-context"></div><button class="icon-btn" id="back-flight" aria-label="Back to flight">‹</button><div class="wine-heading"><div class="wine-number" id="wine-number"></div><h2 id="wine-name"></h2><div class="subtle" id="wine-status"></div></div><button id="noteworthy" class="noteworthy-button" type="button" aria-label="Mark wine as noteworthy" aria-pressed="false" title="Mark wine as noteworthy"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-4-6 4z"/></svg></button></header><div class="attribute-progress"><div id="attribute-track" class="attribute-track" role="progressbar" aria-label="Scoring attributes completed" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"></div><span id="attribute-progress-copy">0 / 5</span></div><div id="criteria-list" class="criteria-list"></div><p class="judge-saved" id="draft-status" role="status"></p><div class="wine-total"><span id="wine-total-label">Draft total</span><strong><span id="wine-total">0</span><small> / 20</small></strong></div><div class="sticky-actions"><button class="secondary" id="save-back">Back to flight</button><button class="primary" id="submit-wine" disabled>Submit wine</button></div></div></section></main><script src="/shared/supabase.js"></script><script src="/shared/config.js"></script><script type="module" src="app.js"></script></body></html>
