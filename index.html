<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rarify Judging Platform</title><link rel="stylesheet" href="/shared/styles.css"></head><body><main class="portal"><div class="brand">rarify</div><h1>CIWF 2027</h1><p id="welcome">Loading your event access…</p><div id="sections"></div></main><script src="/shared/supabase.js"></script><script src="/shared/config.js"></script><script type="module">import {requireUser,toolbar,$,guard} from '/shared/app.js';guard(async()=>{const a=await requireUser();toolbar(a);$('#welcome').textContent='Choose your workspace.';const sections=[['admin','Admin','Panels, wines, flights and event participants',['admin']],['moderator','Moderator & results','Release flights and follow submitted scores',['admin','moderator']],['judges','Judge','Your released flights and private scorecards',['judge']]];for(const [path,title,description,roles] of sections){if(!roles.some(r=>a.roles.includes(r)))continue;const link=document.createElement('a');link.className='section-link';link.href='/'+path+'/';link.innerHTML=`<strong>${title} →</strong><span>${description}</span>`;$('#sections').append(link);}if(!a.roles.length)$('#welcome').textContent='Your login is ready. Ask the event administrator to assign you a role.';})();</script></body></html>
