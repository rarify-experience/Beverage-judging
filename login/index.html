<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Rarify Judging</title><link rel="stylesheet" href="/shared/styles.css"></head><body><main class="portal"><div class="brand">rarify</div><h1>Welcome to judging.</h1><nav class="login-options" aria-label="Account access"><button id="show-login" type="button" aria-pressed="true">Sign in</button><button id="show-activation" type="button" aria-pressed="false">Create password</button></nav><p id="login-intro">Sign in with your email and password.</p><form id="login-form"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><section id="activation-section" hidden><h2>Set up your event account</h2><p id="activation-copy">Enter your imported judge email or administrator-approved staff email. We’ll email a verification link so you can choose your password.</p><form id="activation-form"><label>Event email<input name="email" type="email" autocomplete="email" required></label><div id="test-password-fields" hidden><label>New password<input id="test-password" name="newpassword" type="password" autocomplete="new-password" minlength="6"><small>Use at least 6 characters.</small></label><label>Confirm password<input id="test-password-confirm" name="confirmpassword" type="password" autocomplete="new-password" minlength="6"></label></div><button>Send activation link</button></form><p id="activation-sent" role="status"></p></section><p id="login-error" class="form-error" role="alert"></p></main><script src="/shared/supabase.js"></script><script src="/shared/config.js"></script><script type="module" src="app.js"></script></body></html>
